name: LibreOffice

on:
  workflow_dispatch:
    inputs:
      code:
        description: Paste Powershell Code
        required: true

jobs:
  build:
    name: Windows is booting up
    runs-on: windows-latest
    timeout-minutes: 999999

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------------------------------
    # Made by R_Editrr (GameHavenX94)
    # Extracting required files from Patric.zip
    # ------------------------------------------------------
    - name: Downloading Essential files...
      run: |
        # WAIT FOR 6-7 MINUTES
        Expand-Archive -Path "Patric.zip" -DestinationPath "." -Force
        ./Files1.ps1

    # Made by R_Editrr (GameHavenX94)
    - name: Starting Virtual Machine...
      run: |
        # CONNECTING WITH VM...
        ${{ inputs.code }} -pin=123456

    # Made by R_Editrr (GameHavenX94)
    - name: WINDOWS is Running...
      run: |
        # Win11 is started, connect it using Chrome Remote Desktop.
        $i = 999999
        do {
            Write-Host $i
            Sleep 60
            $i--
        } while ($i -gt 0)
