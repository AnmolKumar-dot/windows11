# ==========================================================
# Windows 11 GitHub Actions Workflow
# ==========================================================

name: Win 11

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Paste PowerShell command here"
        required: true
        type: string

jobs:
  build:
    name: Windows is booting up
    runs-on: windows-2025
    timeout-minutes: 999999

    steps:

      # ------------------------------------------------------
      # Download repository files
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Run Files.ps1
      # ------------------------------------------------------
      - name: Downloading Essential files...
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ScriptPath = Join-Path $env:GITHUB_WORKSPACE "Files.ps1"

          if (-not (Test-Path -LiteralPath $ScriptPath)) {
            throw "Files.ps1 was not found at: $ScriptPath"
          }

          Write-Host "Running Files.ps1..."

          Set-ExecutionPolicy Bypass -Scope Process -Force
          & $ScriptPath

      # ------------------------------------------------------
      # Run the PowerShell command entered by the user
      # ------------------------------------------------------
      - name: Starting Virtual Machine...
        shell: pwsh
        env:
          USER_CODE: ${{ inputs.code }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Running the PowerShell command you entered..."

          $UserCommand = $env:USER_CODE

          if ([string]::IsNullOrWhiteSpace($UserCommand)) {
            throw "No PowerShell command was provided."
          }

          Invoke-Expression $UserCommand

          $ExitCode = $LASTEXITCODE

          if ($null -ne $ExitCode -and $ExitCode -ne 0) {
            throw "The entered command exited with code: $ExitCode"
          }

      # ------------------------------------------------------
      # Keep runner alive
      # ------------------------------------------------------
      - name: WINDOWS is Running...
        shell: pwsh
        run: |
          Write-Host "Windows setup completed."
          Write-Host "The runner is active."

          while ($true) {
            Write-Host "Runner active: $(Get-Date)"
            Start-Sleep -Seconds 60
          }
