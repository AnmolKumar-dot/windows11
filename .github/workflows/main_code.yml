# ==========================================================
# Windows GitHub Actions Workflow
# ==========================================================

name: Win 11

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Paste the PowerShell host setup command"
        required: true
        type: string

jobs:
  build:
    name: Windows is booting up
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ------------------------------------------------------
      # Download repository files
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Run Files.ps1
      # ------------------------------------------------------
      - name: Installing essential files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ScriptPath = Join-Path $env:GITHUB_WORKSPACE "Files.ps1"

          if (-not (Test-Path -LiteralPath $ScriptPath)) {
            throw "Files.ps1 was not found at: $ScriptPath"
          }

          Write-Host "Running Files.ps1..."

          Set-ExecutionPolicy Bypass -Scope Process -Force
          & $ScriptPath

          if ($LASTEXITCODE -ne 0) {
            throw "Files.ps1 failed with exit code: $LASTEXITCODE"
          }

      # ------------------------------------------------------
      # Validate Chrome Remote Desktop installation
      # ------------------------------------------------------
      - name: Checking Remote Desktop Host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $CRDPaths = @(
            "${env:ProgramFiles(x86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe",
            "$env:ProgramFiles\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          )

          $CRDExe = $CRDPaths |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1

          if (-not $CRDExe) {
            throw "Chrome Remote Desktop Host executable was not found."
          }

          Write-Host "Chrome Remote Desktop Host found."

      # ------------------------------------------------------
      # Run the command entered when starting the workflow
      # ------------------------------------------------------
      - name: Starting Remote Desktop Host
        shell: pwsh
        env:
          USER_CODE: ${{ inputs.code }}
        run: |
          $ErrorActionPreference = "Stop"

          $Command = $env:USER_CODE.Trim()

          if ([string]::IsNullOrWhiteSpace($Command)) {
            throw "No PowerShell command was provided."
          }

          Write-Host "Running the command..."

          # Run exactly what was entered.
          # Do NOT append a PIN here.
          Invoke-Expression $Command

          if ($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0) {
            throw "Command failed with exit code: $LASTEXITCODE"
          }

      # ------------------------------------------------------
      # Keep the runner active
      # ------------------------------------------------------
      - name: WINDOWS is Running
        shell: pwsh
        run: |
          Write-Host "Setup completed."
          Write-Host "Runner is active."

          while ($true) {
            Write-Host "Still running: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
