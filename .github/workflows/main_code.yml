# ==========================================================
# Windows 11 GitHub Actions Workflow
# ==========================================================

name: Win 11

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Paste PowerShell command here"
        required: true
        type: string

jobs:
  build:
    name: Windows is booting up
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installing essential files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ScriptPath = Join-Path $env:GITHUB_WORKSPACE "Files.ps1"

          if (-not (Test-Path -LiteralPath $ScriptPath)) {
            throw "Files.ps1 was not found at: $ScriptPath"
          }

          Write-Host "=========================================="
          Write-Host "Running Files.ps1..."
          Write-Host "Path: $ScriptPath"
          Write-Host "=========================================="

          Set-ExecutionPolicy Bypass -Scope Process -Force

          try {
            & $ScriptPath

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "[OK] Files.ps1 completed successfully."
            Write-Host "=========================================="
          }
          catch {
            Write-Host ""
            Write-Host "=========================================="
            Write-Host "[ERROR] Files.ps1 failed!"
            Write-Host "=========================================="
            Write-Host "Error message:"
            Write-Host $_.Exception.Message
            Write-Host ""
            Write-Host "Script stack trace:"
            Write-Host $_.ScriptStackTrace
            throw
          }

      - name: Starting configured command
        shell: pwsh
        env:
          USER_CODE: ${{ inputs.code }}
        run: |
          $ErrorActionPreference = "Stop"

          $UserCommand = $env:USER_CODE

          if ([string]::IsNullOrWhiteSpace($UserCommand)) {
            throw "No PowerShell command was provided."
          }

          Write-Host "Running the command entered in Run workflow..."

          try {
            Invoke-Expression $UserCommand
          }
          catch {
            Write-Host "[ERROR] The entered PowerShell command failed."
            Write-Host $_.Exception.Message
            throw
          }

      - name: WINDOWS is Running
        shell: pwsh
        run: |
          Write-Host "Setup completed."
          Write-Host "The runner will remain active until the job timeout."

          while ($true) {
            Write-Host "Still running: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
          
